name: Deploy Infra

on:
  push:
    branches:
      - infra
    # paths:
    #   - 'aws/2026/05/static-web-sre/src/environments/infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::345003923266:role/github_action-infra_branch
  BUCKET_NAME: lee-static-web-sre-prod
  WORKING_DIR: aws/2026/05/static-web-sre/src/environments/infra/
  PLAN_FILE_NAME: cloudwatch-deploy
  TERRAFORM_ENV_FILE: infra.tfvars

jobs:
  start-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # Git 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v7

      # Terraform 작업
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.4"

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -out ${{ env.PLAN_FILE_NAME }} -var-file ${{ env.TERRAFORM_ENV_FILE }} -var email_address=${{ secrets.EMAIL_ADDRESS }} -no-color

      - name: Terraform Apply
        run: terraform apply ${{ env.PLAN_FILE_NAME }}